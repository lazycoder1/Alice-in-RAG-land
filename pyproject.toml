[project]
name = "simplerag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.19.0",
    "docling>=2.58.0",
    "lancedb>=0.25.2",
    "ollama>=0.4.0",
    "openai>=2.6.0",
